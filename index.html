<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script type="module" src="./components/lazy-modal/lazy-modal.js"></script>

<body>
    <!-- TRIGGERS -->
    <p>
        <button class="map-trigger" type="button">Your Location</button>
    </p>

    <!-- MODALS -->

    <!-- map-picker https://github.com/nonsalant/map-picker/ -->
    <lazy-modal popover
        id="map-wrapper"
        triggers=".map-trigger"
        close-button
        inner-styles="../map-picker/map-picker.css"
        inner-scripts="../map-picker/map-picker.js"
        inner-content="../map-picker/map-picker.html"
    ></lazy-modal>

</body>
</html>
