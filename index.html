<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <!-- <script type="module" src="./components/location-input/location-input.js?define=false"></script> -->
    <style>
        /* Demo styles */
        *, *::before, *::after { box-sizing: border-box; }
        html { color-scheme: light dark;  text-wrap: balance; tab-size: 2; }
        body { width: 90%; max-width: min(700px, 100%); margin-inline: auto; }
        output > * { transition: all .6s ease-out; @starting-style { background: yellow; } }
        /* pre { overflow: auto; font-size: .9em; border: solid 1px; padding: 3px; } */
    </style>
</head>
<body>
    <h2><span aria-hidden="true">📌</span> Location Input web component</h2>

    <location-input>
        <button type="button" class="location-trigger">
            <span>Set</span> <span>/</span> <span>Edit</span> <span>Location</span>
        </button>
        <!-- Demo implementation: location inserted in <output> element -->
        <p><output></output></p>
    </location-input>

    <script type="module">
        import LocationInput from './components/location-input/location-input.js?define=false';

        // Demo implementation for 'location-confirm' and 'location-reset' event handlers
        // Apply handlers to LocationInput prototype
        Object.assign(LocationInput.prototype, {

            // Log + inject coordinates + address when 'location-confirm' custom event is fired
            handleLocationConfirm(e) {
                console.log(`[${e.lat}, ${e.lng}]: ${e.address}`);
                const outputEl = this.domRoot.querySelector('output');
                outputEl.innerHTML = `<ul>
                    <li>latitude: ${e.lat}</li>
                    <li>longitude: ${e.lng}</li>
                    <li>address: ${e.address}</li>
                </ul>`;
            },

            // Clear the <output> element when the 'location-reset' custom event is fired
            handleLocationReset() {
                const outputEl = this.domRoot.querySelector('output');
                outputEl.innerText = '';
            }

        });

        // Define the element
        customElements.define('location-input', LocationInput);
    </script>

</body>
</html>
