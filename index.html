<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script type="module" src="./components/lazy-modal/lazy-modal.js"></script>
    <style>
        /* Demo styles */
        html { color-scheme: light dark; }
        body { width: 90%; max-width: min(700px, 100%); margin-inline: auto; }
        [popover] { max-width: calc(100dvw - 4lh); max-height: calc(100dvh - 4lh); padding: 1lh; border-radius: .5lh; }
        /* hide reset button if it follows an empty output */
        body:has(output:empty) .reset-location { display: none; }
    </style>
</head>
<body>
    <h2><span aria-hidden="true">📌</span> Location Input web component</h2>

    <location-input>

        <button popovertarget="location-wrapper" type="button" class="location-trigger">Set location</button>

        <lazy-modal popover
            id="location-wrapper"
            triggers=".location-trigger"
            close-button
        >
            <button class="geo-trigger" onclick="this.closest('[popover]')?.hidePopover()" type="button">
                Auto-detect
            </button>
            <button class="map-trigger" popovertarget="map-wrapper" onclick="this.closest('[popover]')?.hidePopover()" type="button">
                Pick manually
            </button>
            <button class="reset-location" onclick="this.closest('[popover]')?.hidePopover()" type="button">
                <span aria-hidden="true">❌</span> <span>Reset Location</span>
            </button>
        </lazy-modal>

        <p><output></output></p>

        <!-- map-picker https://github.com/nonsalant/map-picker/ -->
        <lazy-modal popover
            id="map-wrapper"
            triggers=".map-trigger"
            close-button
            inner-styles="../map-picker/map-picker.css"
            inner-scripts="../map-picker/map-picker.js"
            inner-content="../map-picker/map-picker.html"
        ></lazy-modal>

    </location-input>

</body>
</html>
