<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script type="module" src="./components/lazy-modal/lazy-modal.js"></script>
    <style>
        /* Demo styles */
        html { color-scheme: light dark; }
        body { width: 90%; max-width: min(700px, 100%); margin-inline: auto; }
        [popover] { max-width: calc(100dvw - 4lh); max-height: calc(100dvh - 4lh); padding: 1lh; border-radius: .5lh; }
        /* hide reset button if it follows an empty output */
        output:empty + br + .reset-location { display: none; }
    </style>
</head>
<body>
    <h2><span aria-hidden="true">📌</span> Select a location</h2>
    <button popovertarget="map-wrapper" type="button" class="map-trigger">Open Map</button>

    <output></output><br>

    <button class="reset-location" type="button">
        <span aria-hidden="true">❌</span> <span>Reset Location</span>
    </button>

    <!-- map-picker https://github.com/nonsalant/map-picker/ -->
    <lazy-modal popover
        id="map-wrapper"
        triggers=".map-trigger"
        close-button
        inner-styles="../map-picker/map-picker.css"
        inner-scripts="../map-picker/map-picker.js"
        inner-content="../map-picker/map-picker.html"
    ></lazy-modal>

</body>
</html>
