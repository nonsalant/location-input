<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script type="module" src="./components/location-input/location-input.js"></script>
    <style>
        /* Demo styles */
        html { color-scheme: light dark; }
        body { width: 90%; max-width: min(700px, 100%); margin-inline: auto; }
        [popover] { max-width: calc(100dvw - 4lh); max-height: calc(100dvh - 4lh); padding: 1lh; border-radius: .5lh; }
        /* hide reset button if it follows an empty output */
        body:has(output:empty) .reset-location { display: none; }
    </style>
</head>
<body>
    <h2><span aria-hidden="true">📌</span> Location Input web component</h2>

    <location-input>
        <button type="button" class="location-trigger">Set location</button>
        <p><output></output></p>
    </location-input>

</body>
</html>
