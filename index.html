<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script type="module" src="./components/location-input/location-input.js"></script>
    <style>
        /* Demo styles */
        *, *::before, *::after { box-sizing: border-box; }
        html { color-scheme: light dark;  text-wrap: balance; tab-size: 2; }
        body { width: 90%; max-width: min(700px, 100%); margin-inline: auto; }
        output > * { transition: all .6s ease-out; @starting-style { background: yellow; } }
        /* pre { overflow: auto; font-size: .9em; border: solid 1px; padding: 3px; } */
    </style>
</head>
<body>
    <h2><span aria-hidden="true">📌</span> Location Input web component</h2>

    <location-input>
        <button type="button" class="location-trigger">
            <span>Set</span> <span>/</span> <span>Edit</span> <span>Location</span>
        </button>
        <!-- Demo implementation: location inserted in <output> element -->
        <!-- see components/location-input/location-input.js: handleLocationConfirm() and handleLocationReset() -->
        <p><output></output></p>
    </location-input>

    <script>
        // demo implementation
        
        document.addEventListener('location-confirm', async (e) => {
            // Log + inject coordinates and address when 'map-picker-confirm' custom event is fired
            console.log(`[${e.lat}, ${e.lng}]: ${e.address}`);
            const outputEl = document.querySelector('output');
            outputEl.innerHTML = `<ul>
                <li>latitude: ${e.lat}</li>
                <li>longitude: ${e.lng}</li>
                <li>address: ${e.address}</li>
            </ul>`;
        });
        
        document.addEventListener('location-reset', () => {
            // Clear the <output> element when the 'map-picker-reset' custom event is fired
            const outputEl = document.querySelector('output');
            outputEl.innerText = '';
        });
    </script>

</body>
</html>
